name: Smart regression

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff PR
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed.txt
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

      - name: Папки колекції з Postman
        run: |
          echo "COLLECTION_UID: '${{ vars.COLLECTION_UID }}'"
          curl -s -H "X-Api-Key: $POSTMAN_API_KEY" \
            "https://api.getpostman.com/collections/${{ vars.COLLECTION_UID }}" > collection.json
          if ! jq -e '.collection' collection.json > /dev/null; then
            echo "Postman API не повернув колекцію. Відповідь:"
            jq . collection.json || cat collection.json
            exit 1
          fi
          jq -r '.collection.item[].name' collection.json > folders.txt
          echo "Папки:"; cat folders.txt

      - name: Скрипт-мапінг
        run: |
          node qa/scripts/select-regression.mjs < changed.txt > by-script.txt
          cat by-script.txt

      - name: LLM-селектор
        run: |
          npm install -g @anthropic-ai/claude-code
          { echo "## Папки колекції"; cat folders.txt; echo; echo "## Diff"; cat pr.diff; } > "$RUNNER_TEMP/context.txt"
          cd "$RUNNER_TEMP"
          if claude -p "Ти QA. Нижче список папок Postman-колекції і diff PR. Нічого не читай і не запускай, відповідай лише за цим текстом. \
          Вибери папки, які треба перезапустити. Формат: один рядок на папку, 'назва папки | причина'. Якщо API не зачеплено, нічого не пиши." \
            --model sonnet --max-turns 3 < context.txt > llm-out.txt 2> llm-error.txt; then
            cp llm-out.txt "$GITHUB_WORKSPACE/llm.txt"
          else
            { echo "LLM не відповіла, запускаю всі папки."; echo "stdout:"; cat llm-out.txt; echo "stderr:"; cat llm-error.txt; } > "$GITHUB_WORKSPACE/llm.txt"
            cp "$GITHUB_WORKSPACE/folders.txt" "$GITHUB_WORKSPACE/by-llm.txt"
          fi
          cd "$GITHUB_WORKSPACE"
          if [ ! -f by-llm.txt ]; then
            cut -d'|' -f1 llm.txt | sed -E 's/^[-*[:space:]`]+//; s/[[:space:]`]+$//' \
              | grep -Fx -f folders.txt > by-llm.txt || true
          fi
          cat llm.txt

      - name: Postman CLI — запуск вибраних папок
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          postman login --with-api-key "$POSTMAN_API_KEY"
          sort -u by-script.txt by-llm.txt | grep -Fx -f folders.txt | grep -vx '00 Setup' > selected.txt || true
          echo "Немає в колекції (пропускаю):"; sort -u by-script.txt by-llm.txt | grep -vFx -f folders.txt || true
          args=(-i "00 Setup")
          while IFS= read -r f; do args+=(-i "$f"); done < selected.txt
          echo "Запускаю: ${args[*]}"
          postman collection run ${{ vars.COLLECTION_UID }} -e ${{ vars.ENVIRONMENT_UID }} \
            --env-var "baseUrl=https://skypermit.vercel.app/api/v1" "${args[@]}" | tee run.txt

      - name: Коментар у PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Smart regression"
            echo "**Скрипт-мапінг:**"; cat by-script.txt 2>/dev/null || echo "не запускався"; echo
            echo "**LLM-селектор:**"; echo '```'; cat llm.txt 2>/dev/null || echo "не запускався"; echo '```'
            echo "**Результат Postman:**"; echo '```'; tail -40 run.txt 2>/dev/null || echo "не запускався"; echo '```'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
