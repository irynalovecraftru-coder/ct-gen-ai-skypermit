name: Smart regression

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff PR
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed.txt
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

      - name: Папки колекції з Postman
        run: |
          curl -s -H "X-Api-Key: $POSTMAN_API_KEY" \
            https://api.getpostman.com/collections/${{ vars.COLLECTION_UID }} \
            | jq -r '.collection.item[].name' > folders.txt
          test -s folders.txt

      - name: Скрипт-мапінг
        run: node scripts/select-regression.mjs < changed.txt > by-script.txt

      - name: LLM-селектор
        run: |
          npm install -g @anthropic-ai/claude-code
          { echo "## Папки колекції"; cat folders.txt; echo; echo "## Diff"; cat pr.diff; } > context.txt
          if claude -p "Ти QA. За diff вибери папки колекції, які треба перезапустити. \
          Формат: один рядок на папку, 'назва папки | причина'. Якщо API не зачеплено, нічого не пиши." \
            --model claude-sonnet-5-5 --max-turns 1 < context.txt > llm.txt; then
            cut -d'|' -f1 llm.txt | sed -E 's/^[-*[:space:]`]+//; s/[[:space:]`]+$//' \
              | grep -Fx -f folders.txt > by-llm.txt || true
          else
            echo "LLM не відповіла, запускаю всі папки" > llm.txt
            cp folders.txt by-llm.txt
          fi

      - name: Postman CLI — запуск вибраних папок
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          postman login --with-api-key "$POSTMAN_API_KEY"
          sort -u by-script.txt by-llm.txt | grep -vxE '00 Setup|' > selected.txt || true
          args=(-i "00 Setup")
          while IFS= read -r f; do args+=(-i "$f"); done < selected.txt
          postman collection run ${{ vars.COLLECTION_UID }} -e ${{ vars.ENVIRONMENT_UID }} \
            --env-var "baseUrl=https://skypermit.vercel.app" "${args[@]}" | tee run.txt

      - name: Коментар у PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Smart regression"
            echo "**Скрипт-мапінг:**"; cat by-script.txt 2>/dev/null; echo
            echo "**LLM-селектор:**"; echo '```'; cat llm.txt 2>/dev/null; echo '```'
            echo "**Результат Postman:**"; echo '```'; tail -40 run.txt 2>/dev/null || echo "не запускався"; echo '```'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
